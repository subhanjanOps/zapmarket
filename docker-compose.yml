services:
  kafka:
    image: apache/kafka:latest
    container_name: zapmarket-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - 9092:9092
      - 29092:29092
    networks:
      - zapnet
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: zapmarket-redis
    ports:
      - 6379:6379
    networks:
      - zapnet
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: zapmarket-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - zapnet
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot job: waits for minio to be healthy, then creates the
  # `zapmarket` bucket if it doesn't already exist and sets it to allow
  # anonymous (public) downloads, then exits. The official minio/minio image
  # has no built-in "create this bucket on boot" env var (that's a
  # bitnami/minio-only feature) — `mc mb --ignore-existing` is the standard
  # way to get the same effect idempotently. Anonymous download is needed so
  # uploaded product images are servable via a plain URL, consistent with
  # the rest of the catalog's public, unauthenticated read endpoints.
  minio-init:
    image: minio/mc:latest
    container_name: zapmarket-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - zapnet
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/zapmarket &&
      mc anonymous set download local/zapmarket &&
      echo 'bucket zapmarket ready (public download)'
      "
    restart: "no"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: zapmarket-auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=zapmarket-postgres
      - DB_PORT=5432
      - DB_USER=zapuser
      - DB_PASSWORD=zappass123
      - DB_NAME=userauth
      - JWT_SECRET_KEY=change-me-in-production
      - JWT_REFRESH_SECRET_KEY=change-me-refresh-in-production
      - JWT_ACCESS_EXPIRY_HOURS=1
      - JWT_REFRESH_EXPIRY_DAYS=7
      - HTTP_PORT=8080
      - GRPC_PORT=50051
      - APP_ENV=development
      - REDIS_URL=zapmarket-redis:6379
    ports:
      - "8080:8080"
      - "50051:50051"
    networks:
      - zapnet
    restart: unless-stopped

  product-catalog-service:
    build:
      context: .
      dockerfile: services/product-catalog-service/Dockerfile
    container_name: zapmarket-product-catalog-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      - DB_HOST=zapmarket-postgres
      - DB_PORT=5432
      - DB_USER=zapuser
      - DB_PASSWORD=zappass123
      - DB_NAME=productcatalog
      - JWT_SECRET_KEY=change-me-in-production
      - AUTH_SERVICE_ADDR=zapmarket-auth-service:50051
      - HTTP_PORT=8081
      - GRPC_PORT=50052
      - APP_ENV=development
      - MINIO_ENDPOINT=zapmarket-minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=zapmarket
      - MINIO_USE_SSL=false
      - REDIS_URL=zapmarket-redis:6379
    ports:
      - "8081:8081"
      - "50052:50052"
    networks:
      - zapnet
    restart: unless-stopped

  order-management-service:
    build:
      context: .
      dockerfile: services/order-management-service/Dockerfile
    container_name: zapmarket-order-management-service
    depends_on:
      postgres:
        condition: service_started
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=zapmarket-postgres
      - DB_PORT=5432
      - DB_USER=zapuser
      - DB_PASSWORD=zappass123
      - DB_NAME=ordermgmt
      - AUTH_SERVICE_ADDR=zapmarket-auth-service:50051
      - INVENTORY_SERVICE_ADDR=zapmarket-inventory-service:50053
      - PAYMENT_SERVICE_ADDR=zapmarket-payment-service:50054
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=zapmarket-redis:6379
      - HTTP_PORT=8084
      - APP_ENV=development
    ports:
      - "8084:8084"
    networks:
      - zapnet
    restart: unless-stopped

  currency-service:
    build:
      context: .
      dockerfile: services/currency-service/Dockerfile
    container_name: zapmarket-currency-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=zapmarket-postgres
      - DB_PORT=5432
      - DB_USER=zapuser
      - DB_PASSWORD=zappass123
      - DB_NAME=currency
      - HTTP_PORT=8086
      - GRPC_PORT=50056
      - APP_ENV=development
      - REDIS_URL=zapmarket-redis:6379
      - RATE_PROVIDER_URL=https://api.frankfurter.app
      - RATE_REFRESH_INTERVAL=1h
      - MAX_RATE_AGE=24h
    ports:
      - "8086:8086"
      - "50056:50056"
    networks:
      - zapnet
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: zapmarket-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      - HTTP_PORT=8000
      - DB_HOST=zapmarket-postgres
      - DB_PORT=5432
      - DB_USER=zapuser
      - DB_PASSWORD=zappass123
      - DB_NAME=apigateway
      - REDIS_URL=zapmarket-redis:6379
      - AUTH_SERVICE_ADDR=zapmarket-auth-service:50051
      - AUTH_SERVICE_HTTP_URL=http://zapmarket-auth-service:8080
      - CATALOG_SERVICE_HTTP_URL=http://zapmarket-product-catalog-service:8081
      - ORDER_SERVICE_HTTP_URL=http://zapmarket-order-management-service:8084
      - CURRENCY_SERVICE_HTTP_URL=http://zapmarket-currency-service:8086
      - GATEWAY_AUTO_BIND=true
      - ADMIN_UI_ORIGIN=http://localhost:3001
      - APP_ENV=development
    ports:
      - "8000:8000"
    networks:
      - zapnet
    restart: unless-stopped

  seller-ui:
    build:
      context: ./services/seller-ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8000
    container_name: zapmarket-seller-ui
    depends_on:
      - api-gateway
    environment:
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - GATEWAY_URL=http://zapmarket-api-gateway:8000
    ports:
      - "3002:3002"
    networks:
      - zapnet
    restart: unless-stopped

  admin-ui:
    build:
      context: ./services/admin-ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8000
    container_name: zapmarket-admin-ui
    depends_on:
      - api-gateway
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      # Server-side only: used by the BFF proxy routes to reach the gateway
      # inside the Docker network without going through the host-mapped port.
      - GATEWAY_URL=http://zapmarket-api-gateway:8000
    ports:
      - "3001:3001"
    networks:
      - zapnet
    restart: unless-stopped

  backoffice-ui:
    build:
      context: ./services/backoffice-ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8000
    container_name: zapmarket-backoffice-ui
    depends_on:
      - api-gateway
    environment:
      - PORT=3003
      - HOSTNAME=0.0.0.0
      - GATEWAY_URL=http://zapmarket-api-gateway:8000
    ports:
      - "3003:3003"
    networks:
      - zapnet
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: zapmarket-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=zapmarket
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "8090:8080"
    networks:
      - zapnet
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: zapmarket-notification-service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=zapmarket-redis:6379
      - APP_ENV=development
    ports:
      - "8085:8085"
    networks:
      - zapnet
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: zapmarket-inventory-service
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - DB_HOST=zapmarket-postgres
      - DB_PORT=5432
      - DB_USER=zapuser
      - DB_PASSWORD=zappass123
      - DB_NAME=inventory
      - HTTP_PORT=8082
      - GRPC_PORT=50053
      - APP_ENV=development
      - REDIS_URL=zapmarket-redis:6379
      - KAFKA_BROKERS=kafka:9092
    ports:
      - "8082:8082"
      - "50053:50053"
    networks:
      - zapnet
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: zapmarket-payment-service
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - DB_HOST=zapmarket-postgres
      - DB_PORT=5432
      - DB_USER=zapuser
      - DB_PASSWORD=zappass123
      - DB_NAME=payment
      - HTTP_PORT=8083
      - GRPC_PORT=50054
      - APP_ENV=development
      - PAYMENT_WEBHOOK_SECRET=change-me-webhook-secret
      - REDIS_URL=zapmarket-redis:6379
      - KAFKA_BROKERS=kafka:9092
    ports:
      - "8083:8083"
      - "50054:50054"
    networks:
      - zapnet
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: zapmarket-postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=zapuser
      - POSTGRES_PASSWORD=zappass123
    ports:
      - 5432:5432
    networks:
      - zapnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapuser -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zapmarket-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@zapmarket.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - 5050:80
    networks:
      - zapnet
    volumes:
      - pgadmin-data:/var/lib/pgadmin

