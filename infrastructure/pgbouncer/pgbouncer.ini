[databases]
userauth       = host=zapmarket-postgres port=5432 dbname=userauth
productcatalog = host=zapmarket-postgres port=5432 dbname=productcatalog
ordermgmt      = host=zapmarket-postgres port=5432 dbname=ordermgmt
inventory      = host=zapmarket-postgres port=5432 dbname=inventory
payment        = host=zapmarket-postgres port=5432 dbname=payment
currency       = host=zapmarket-postgres port=5432 dbname=currency
settlement     = host=zapmarket-postgres port=5432 dbname=settlement
cart           = host=zapmarket-postgres port=5432 dbname=cart
reviews        = host=zapmarket-postgres port=5432 dbname=reviews
promotions     = host=zapmarket-postgres port=5432 dbname=promotions
logistics      = host=zapmarket-postgres port=5432 dbname=logistics
wishlist       = host=zapmarket-postgres port=5432 dbname=wishlist
apigateway     = host=zapmarket-postgres port=5432 dbname=apigateway

[pgbouncer]
listen_addr       = 0.0.0.0
listen_port       = 5432
auth_type         = md5
auth_file         = /etc/pgbouncer/userlist.txt
pool_mode         = transaction
max_client_conn   = 1000
default_pool_size = 20
reserve_pool_size = 5
log_connections   = 1
log_disconnections = 1
