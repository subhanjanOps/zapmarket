syntax = "proto3";

package product_catalog;

option go_package = "github.com/zapmarket/zapmarket/pkg/proto/catalog;productcatalogpb";

message ProductProto {
  string id          = 1;
  string category_id = 2;
  string seller_id   = 3;
  string name        = 4;
  string slug        = 5;
  string description = 6;
  string attributes  = 7; // JSON string
  string status      = 8;
  string created_at  = 9;
  string updated_at  = 10;
}

message SKUProto {
  string id            = 1;
  string product_id    = 2;
  string sku_code      = 3;
  string variant_attrs = 4; // JSON string
  int64  price_amount  = 5;
  int64  compare_price = 6; // 0 means not set
  string currency      = 7;
  int32  weight_grams  = 8; // 0 means not set
  bool   is_active     = 9;
  string created_at    = 10;
  string updated_at    = 11;
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  ProductProto product       = 1;
  string       error_message = 2;
}

message GetSKURequest {
  string sku_id = 1;
}

message GetSKUResponse {
  SKUProto sku           = 1;
  string   error_message = 2;
}

message GetSKUsByProductRequest {
  string product_id  = 1;
  bool   active_only = 2;
}

message GetSKUsByProductResponse {
  repeated SKUProto skus          = 1;
  string            error_message = 2;
}

service ProductCatalogService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc GetSKU(GetSKURequest) returns (GetSKUResponse);
  rpc GetSKUsByProduct(GetSKUsByProductRequest) returns (GetSKUsByProductResponse);
}
