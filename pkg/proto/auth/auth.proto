syntax = "proto3";

package auth;

option go_package = "github.com/zapmarket/zapmarket/pkg/proto/auth;authpb";

message User {
  string id = 1;
  string email = 2;
  string phone = 3;
  string full_name = 4;
  string role = 5; // "buyer", "seller", "admin"
  bool is_verified = 6;
  string created_at = 7;
  string updated_at = 8;
  string seller_status = 9; // "PENDING" | "APPROVED" | "REJECTED" | "SUSPENDED" (empty for non-sellers)
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  User user = 2;
  string error_message = 3;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
  string error_message = 2;
}

message LoginPasswordRequest {
  string email = 1;
  string password = 2;
}

message LoginPasswordResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  string error_message = 4;
}

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
}

message RegisterUserResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  string error_message = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string error_message = 2;
}

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc LoginPassword(LoginPasswordRequest) returns (LoginPasswordResponse);
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc RefreshAccessToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}
