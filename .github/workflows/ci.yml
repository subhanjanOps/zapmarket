name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Go workspace build ────────────────────────────────────────────────────
  workspace-build:
    name: Go workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - run: go work sync
      - run: go build ./...

  # ── Per-service tests ─────────────────────────────────────────────────────
  go-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - product-catalog-service
          - order-management-service
          - payment-service
          - inventory-service
          - cart-service
          - currency-service
          - settlement-service
          - logistics-service
          - promotions-service
          - review-return-service
          - wishlist-service
          - notification-service
          - import-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: go test ./... -race -count=1

  # ── Docker build verification ──────────────────────────────────────────────
  docker-build:
    name: Docker build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - product-catalog-service
          - order-management-service
          - payment-service
          - inventory-service
          - cart-service
          - currency-service
          - settlement-service
          - logistics-service
          - promotions-service
          - review-return-service
          - wishlist-service
          - notification-service
          - import-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: zapmarket/${{ matrix.service }}:ci

  # ── Helm lint + dry-run ──────────────────────────────────────────────────
  helm-lint:
    name: Helm lint and dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint infrastructure/helm/zapmarket/
      - name: Helm dry-run
        run: helm upgrade --install zapmarket infrastructure/helm/zapmarket/ --dry-run --generate-name

  # ── Next.js UI builds ─────────────────────────────────────────────────────
  ui-build:
    name: UI build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - buyer-ui
          - seller-ui
          - admin-ui
          - backoffice-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build
